name: Code review

# Claude reviews every non-draft pull request and posts its findings as PR comments.
# Uses the same subscription token as the other onato repos (CLAUDE_CODE_OAUTH_TOKEN).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory and
            origin/${{ github.base_ref }} is fetched; use `git diff origin/${{ github.base_ref }}...HEAD`
            for the changes and `gh pr view ${{ github.event.pull_request.number }} --json title,body,commits`
            for context. Read CLAUDE.md and the Makefile first.

            This is a small static personal site: a WebGL cloud shader behind a "stack" of
            details/summary items, and a reading list generated at build time from data/books.yml
            and the Google Books cache in data/google-books/. Judge changes against what matters here:

            - Correctness: broken HTML, dead anchors, shader changes that could fail to compile,
              JavaScript that breaks without WebGL or under prefers-reduced-motion.
            - Performance budget: each built file must stay under the Makefile size limits and the
              home page should need no extra requests. Flag anything that adds weight or a request.
            - Accessibility: contrast of text over the sky, keyboard access to the stack, alt and
              aria where they matter.
            - Data: entries in data/books.yml need a cache record; never invent author names.
            - Copy: typos and inconsistencies, briefly.

            Skip style nits and anything the build already enforces. Say what you could not verify.
            Post the review as one top-level comment with `gh pr comment`. For each finding that
            would break the page or the build, also add an inline comment on the line with
            mcp__github_inline_comment__create_inline_comment. If there is nothing to flag, say so
            in one short comment. Don't post anything else.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
